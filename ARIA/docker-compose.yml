services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      - SERVER_PORT=${SERVER_PORT:-8080}
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DBADD=${DBADD}
      - MODEL=${MODEL}
      - AGENT_HOST=${AGENT_HOST:-localhost}
      - AGENT_PORT=${AGENT_PORT:-8000}

