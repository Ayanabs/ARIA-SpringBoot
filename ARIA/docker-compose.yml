version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DBADD=${DBADD}
      - MODEL=${MODEL}
      - AGENT_HOST=langchain-agent
      - AGENT_PORT=8000
    depends_on:
      - langchain-agent

  langchain-agent:
    build:
      context: ./langchain-agent
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SPRING_BOOT_BASE_URL=http://backend:8080
      - OLLAMA_BASE_URL=http://${MODEL}
      - MODEL_NAME=llama3.1
