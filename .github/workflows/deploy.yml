name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]

jobs:
  docker-and-deploy:
    runs-on: self-hosted  # <--- Triggers the job directly on your Ubuntu 24.04 server
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=sha
            latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ARIA
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy Container Locally
        run: |
          # 1. Stop and remove old running container if it exists
          docker stop aria-container || true
          docker rm aria-container || true
          
          # 2. Run the new container on port 8080
          docker run -d \
            --name aria-container \
            --restart always \
            -p 8080:8080 \
            docker.io/${{ secrets.DOCKERHUB_REPOSITORY }}:latest
          
          # 3. Clean up old unused image layers to save disk space
          docker image prune -f
