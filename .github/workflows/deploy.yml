name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]

env:
  DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}

jobs:
  docker:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ env.DOCKERHUB_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=sha
            latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ARIA
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          envs: DOCKERHUB_TOKEN,DOCKERHUB_USERNAME,DOCKERHUB_REPOSITORY
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
        script: |
          # 1. Log in to Docker Hub on your remote server (Using env variables + sudo)
          echo "$DOCKERHUB_TOKEN" | sudo docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          
          # 2. Pull the newest image 
          sudo docker pull docker.io/$DOCKERHUB_REPOSITORY:latest
          
          # 3. Stop and remove old running container if it exists
          sudo docker stop aria-container || true
          sudo docker rm aria-container || true
          
          # 4. Run the new container 
          sudo docker run -d \
            --name aria-container \
            --restart always \
            -p 8080:8080 \
            docker.io/$DOCKERHUB_REPOSITORY:latest
          
          # 5. Clean up old image variants
          sudo docker image prune -f
          
          # 6. Log out for security
          sudo docker logout
